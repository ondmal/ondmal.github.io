<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Career shape</title>
  <desc id="desc">A timeline from 1997 to 2026. Employers: Teledin 1997 to 1999, Sprinx 1999 to 2004, O2 2004 to 2005, Vodafone 2005 to 2007, Komerční banka (KB) 2007 to 2025, Eurowag 2025 to now. Four roles as bars: backend developer from 1997 to now, team leader and tech lead from 1999 to now, software architect from 1999 to now, solution architect from 2023 to now. Note: no web frontend; desktop UI in the 2000s only.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f4f8"/>
      <stop offset="1" stop-color="#e6eaf1"/>
    </linearGradient>
    <linearGradient id="oursStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f6bff"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f6bff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9b5cff" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="barB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f6bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9b5cff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="barC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f6bff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#9b5cff" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="barD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f6bff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9b5cff" stop-opacity="0.18"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0f172a" fill-opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-25%" width="120%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1e293b" flood-opacity="0.08"/>
    </filter>
    <style>
      text { font-family: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 2.2px; fill: #4f6bff; }
      .h1      { font-size: 21px; font-weight: 600; fill: #0f172a; }
      .lane    { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; fill: #64748b; }
      .emp     { font-size: 12px; font-weight: 600; fill: #111827; }
      .empS    { font-size: 11px; font-weight: 600; fill: #334155; }
      .yr      { font-size: 11px; fill: #64748b; }
      .barT    { font-size: 12.5px; font-weight: 600; fill: #ffffff; }
      .barTd   { font-size: 12.5px; font-weight: 600; fill: #1e2a78; }
      .lbl     { font-size: 12.5px; font-weight: 600; fill: #1e2a78; }
      .note    { font-size: 12px; fill: #475569; }
      .noteB   { font-size: 12px; font-weight: 600; fill: #0f172a; }
      .cardE   { fill: #ffffff; stroke: #dde3ee; stroke-width: 1.2; filter: url(#shadow); }
      .axis    { stroke: #c3ccdb; stroke-width: 1; }
      .tick    { stroke: #c3ccdb; stroke-width: 1; stroke-dasharray: 2 4; }
      .now     { stroke: url(#oursStroke); stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1100" height="440" rx="22" fill="url(#bg)"/>
  <rect width="1100" height="440" rx="22" fill="url(#dots)"/>

  <!-- Header -->
  <text class="eyebrow" x="44" y="44">CAREER SHAPE · 1997 – 2026</text>
  <text class="h1" x="44" y="72">Backend developer throughout; team lead and software architect since 1999; solution architect since 2023</text>

  <!-- Year axis: 1997 at x=150, 2026 at x=1046 → 30.9 px per year -->
  <!-- x(year) = 150 + (year - 1997) * 30.9 -->
  <line class="axis" x1="150" y1="362" x2="1046" y2="362"/>
  <g class="yr" text-anchor="middle">
    <text x="150" y="382">1997</text>
    <text x="242.7" y="382">2000</text>
    <text x="397.2" y="382">2005</text>
    <text x="551.7" y="382">2010</text>
    <text x="706.2" y="382">2015</text>
    <text x="860.7" y="382">2020</text>
    <text x="1015.2" y="382">2025</text>
  </g>
  <line class="tick" x1="242.7" y1="108" x2="242.7" y2="362"/>
  <line class="tick" x1="397.2" y1="108" x2="397.2" y2="362"/>
  <line class="tick" x1="551.7" y1="108" x2="551.7" y2="362"/>
  <line class="tick" x1="706.2" y1="108" x2="706.2" y2="362"/>
  <line class="tick" x1="860.7" y1="108" x2="860.7" y2="362"/>
  <line class="tick" x1="1015.2" y1="108" x2="1015.2" y2="362"/>

  <!-- Employers lane -->
  <text class="lane" x="44" y="138">EMPLOYER</text>
  <!-- Teledin 1997-1999 -->
  <rect class="cardE" x="150" y="112" width="60" height="40" rx="9"/>
  <text class="empS" x="180" y="137" text-anchor="middle">Teledin</text>
  <!-- Sprinx 1999-2004 -->
  <rect class="cardE" x="212" y="112" width="152" height="40" rx="9"/>
  <text class="emp" x="288" y="137" text-anchor="middle">Sprinx</text>
  <!-- O2 (then Eurotel) 2004-2005 -->
  <rect class="cardE" x="366" y="112" width="29" height="40" rx="9"/>
  <!-- Vodafone 2005-2007 -->
  <rect class="cardE" x="397" y="112" width="60" height="40" rx="9"/>
  <text class="empS" x="427" y="137" text-anchor="middle">Vodafone</text>
  <!-- Komerční banka 2007-2025 -->
  <rect class="cardE" x="459" y="112" width="554" height="40" rx="9"/>
  <text class="emp" x="736" y="137" text-anchor="middle">Komerční banka (KB)</text>
  <!-- Eurowag 2025-now -->
  <rect class="cardE" x="1015" y="112" width="45" height="40" rx="9"/>
  <text class="empS" x="1037" y="137" text-anchor="middle">Eurowag</text>
  <text class="empS" x="380.5" y="137" text-anchor="middle">O2</text>

  <!-- Roles lane -->
  <text class="lane" x="44" y="206">ROLE</text>

  <!-- Backend developer 1997 → now -->
  <rect x="150" y="186" width="896" height="30" rx="8" fill="url(#barA)"/>
  <text class="barT" x="166" y="206">Backend developer</text>
  <text class="barT" x="1030" y="206" text-anchor="end">1997 → today</text>

  <!-- Team leader / tech lead 1999 → now, gap 2004-2005 -->
  <rect x="212" y="226" width="834" height="30" rx="8" fill="url(#barB)"/>
  <text class="barTd" x="228" y="246">Team leader · tech lead</text>
  <text class="barTd" x="1030" y="246" text-anchor="end">1999 → today</text>

  <!-- Architect 2005 → now -->
  <rect x="212" y="266" width="834" height="30" rx="8" fill="url(#barC)"/>
  <text class="barTd" x="228" y="286">Software architect</text>
  <text class="barTd" x="1030" y="286" text-anchor="end">1999 → today</text>

  <!-- Solution architect 2023 → now -->
  <rect x="953.4" y="306" width="92.6" height="30" rx="8" fill="url(#barD)"/>
  <text class="lbl" x="941" y="326" text-anchor="end">Solution architect</text>
  <text class="barTd" x="999.7" y="326" text-anchor="middle">2023 → today</text>

  <!-- now line -->
  <line class="now" x1="1046" y1="108" x2="1046" y2="362"/>

  <!-- note -->
  <text class="note" x="550" y="416" text-anchor="middle"><tspan class="noteB">No web frontend.</tspan> Desktop UI (WinForms, DevExpress) in the 2000s; since then backend, architecture and leading the team that builds it.</text>
</svg>
